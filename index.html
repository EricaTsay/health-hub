<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>健康智慧中樞｜AI 助理</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F1F5FA;
  --surface:#fff;
  --surface2:#F6F8FC;
  --border:rgba(15,23,42,0.07);
  --border-md:rgba(15,23,42,0.13);
  --text:#111827;
  --text2:#5B6B85;
  --text3:#98A6BD;

  --green:#0EA968;
  --green-dark:#087A4C;
  --green-bg:#E6F9F1;

  --blue:#2F6FED;
  --blue-dark:#1D53C4;
  --blue-bg:#EAF1FF;

  --purple:#8B5CF6;
  --purple-dark:#6D3FDB;
  --purple-bg:#F3EEFF;

  --amber:#DB7B12;
  --amber-dark:#B5610A;
  --amber-bg:#FFF3E0;

  --teal:#12ADAE;
  --teal-dark:#0D8586;
  --teal-bg:#E3F7F7;

  --red:#E23F3F;
  --red-dark:#B91C1C;
  --red-bg:#FEECEC;

  --brand-grad:linear-gradient(135deg,#0EA968 0%,#12ADAE 55%,#2F6FED 120%);

  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 2px 6px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 10px 24px rgba(16,24,40,.10),0 2px 6px rgba(16,24,40,.05);
  --shadow-lg:0 20px 48px rgba(16,24,40,.18);

  --font:'Inter',system-ui,sans-serif;
  --font-display:'Manrope','Inter',system-ui,sans-serif;
  --r:16px;--r-sm:10px;
  --sidebar:252px;
  --topbar:60px;
}
body{
  font-family:var(--font);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(1100px 520px at 105% -12%, rgba(47,111,237,.07), transparent 60%),
    radial-gradient(900px 460px at -10% 112%, rgba(14,169,104,.08), transparent 60%),
    var(--bg);
}

/* ── TOPBAR ── */
.topbar{
  height:var(--topbar);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 1.5rem;flex-shrink:0;z-index:20;
  box-shadow:var(--shadow-xs);
}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(14,169,104,.3)}
.logo i{font-size:19px;color:#fff}
.topbar-name{font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:-.2px}
.topbar-sub{font-size:12px;color:var(--text3);font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.status-pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green-dark);background:var(--green-bg);border-radius:20px;padding:5px 12px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(14,169,104,.2)}
.icon-btn{border:1px solid var(--border-md);border-radius:var(--r-sm);padding:6px 12px;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;background:var(--surface);color:var(--text2);display:flex;align-items:center;gap:6px;transition:all .15s}
.icon-btn:hover{background:var(--green-bg);border-color:var(--green);color:var(--green-dark)}

/* ── BODY LAYOUT ── */
.body-wrap{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar);flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;
}
.nav-tabs{display:flex;flex-direction:column;padding:14px 12px;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0}
.nav-tab{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border:none;background:transparent;
  border-radius:12px;font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--text2);
  cursor:pointer;text-align:left;transition:all .15s;
}
.nav-ico{width:28px;height:28px;border-radius:9px;background:var(--surface2);color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.nav-ico i{font-size:15px}
.nav-tab:hover{background:var(--surface2);color:var(--text)}
.nav-tab.active{color:var(--text)}
.nav-tab[data-view="chat"].active{background:var(--green-bg)}
.nav-tab[data-view="chat"].active .nav-ico{background:var(--green);color:#fff}
.nav-tab[data-view="collect"].active{background:var(--blue-bg)}
.nav-tab[data-view="collect"].active .nav-ico{background:var(--blue);color:#fff}
.nav-tab[data-view="translate"].active{background:var(--purple-bg)}
.nav-tab[data-view="translate"].active .nav-ico{background:var(--purple);color:#fff}
.nav-tab[data-view="review"].active{background:var(--amber-bg)}
.nav-tab[data-view="review"].active .nav-ico{background:var(--amber);color:#fff}
.sidebar-header{
  padding:16px 16px 10px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.sidebar-title{font-size:11.5px;font-weight:800;color:var(--text3);letter-spacing:.6px;text-transform:uppercase}
.refresh-btn{width:26px;height:26px;border:none;background:transparent;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s}
.refresh-btn:hover{background:var(--green-bg);color:var(--green-dark)}
.refresh-btn i{font-size:15px}
.sidebar-scroll{flex:1;overflow-y:auto;padding:10px 0}
.sidebar-scroll::-webkit-scrollbar{width:3px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:3px}

.topic-item{
  margin:0 10px 8px;padding:12px 13px;cursor:pointer;border-radius:12px;
  border:1px solid transparent;background:var(--surface2);
  transition:all .15s;position:relative;
}
.topic-item:hover{background:var(--surface);border-color:var(--border-md);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.topic-item.active{background:var(--green-bg);border-color:var(--green)}
.topic-tag{
  font-size:10px;font-weight:800;letter-spacing:.3px;
  padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:6px;
}
.tag-hot{background:#FFEADB;color:#C2410C}
.tag-trend{background:var(--green-bg);color:var(--green-dark)}
.tag-risk{background:var(--red-bg);color:#B91C1C}
.tag-policy{background:var(--blue-bg);color:var(--blue-dark)}
.topic-name{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:3px}
.topic-meta{font-size:11.5px;color:var(--text3);line-height:1.4}

.sidebar-loading{padding:20px 14px;display:flex;flex-direction:column;gap:10px}
.skel{height:56px;background:var(--surface2);border-radius:var(--r-sm);animation:pulse 1.4s ease-in-out infinite}
.skel:nth-child(2){opacity:.7}.skel:nth-child(3){opacity:.5}.skel:nth-child(4){opacity:.3}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ── VIEW PANEL SWITCHER ── */
.view-panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.view-panel.active{display:flex}

.view-topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 1.75rem;min-height:60px;display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap;
  box-shadow:var(--shadow-xs);
}
.view-icon-badge{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--green)}
.view-icon-badge i{font-size:17px;color:#fff}
.view-topbar[data-color="collect"] .view-icon-badge{background:var(--blue)}
.view-topbar[data-color="translate"] .view-icon-badge{background:var(--purple)}
.view-topbar[data-color="review"] .view-icon-badge{background:var(--amber)}
.view-icon-badge.sm{width:26px;height:26px;border-radius:8px}
.view-icon-badge.sm i{font-size:13px}
.view-title{font-family:var(--font-display);font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.1px}
.view-tag{font-size:11.5px;font-weight:700;color:var(--text2);background:var(--surface2);padding:5px 12px;border-radius:20px;margin-left:auto}

.view-scroll{flex:1;overflow-y:auto;padding:1.5rem 1.75rem}
.view-scroll::-webkit-scrollbar{width:4px}
.view-scroll::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:4px}

.view-input-row{display:flex;gap:8px;margin-bottom:1.25rem;align-items:flex-start}
.view-input-row input,.view-input-row textarea{
  flex:1;font-family:var(--font);font-size:14px;padding:11px 15px;border:1px solid var(--border-md);
  border-radius:12px;outline:none;background:var(--surface);color:var(--text);
}
.view-input-row input:focus,.view-input-row textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.view-input-row textarea{resize:vertical;min-height:100px;line-height:1.6}

.result-box{position:relative}
.copy-btn{
  position:absolute;top:14px;right:14px;border:1px solid var(--border-md);background:var(--surface);
  border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;font-family:var(--font);cursor:pointer;color:var(--text2);
  display:flex;align-items:center;gap:4px;transition:all .15s;
}
.copy-btn:hover{background:var(--green-bg);border-color:var(--green);color:var(--green-dark)}

.empty-hint{color:var(--text3);font-size:13px;padding:2.5rem 0;text-align:center}

.human-review{background:var(--amber-bg);border:1px solid #F6D9A8;border-radius:var(--r);padding:1.35rem 1.5rem;margin-top:1.35rem}
.hr-title{font-size:13.5px;font-weight:800;color:var(--amber-dark);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.hr-choice-row{display:flex;gap:8px;margin-bottom:10px}
.hr-choice{padding:9px 18px;border-radius:11px;border:1px solid var(--border-md);background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;font-family:var(--font);transition:all .15s}
.hr-choice:hover{border-color:var(--amber)}
.hr-choice.sel-approve.selected{background:var(--green-bg);border-color:var(--green);color:var(--green-dark)}
.hr-choice.sel-revise.selected{background:#FFE3D6;border-color:#D9480F;color:#B8380B}
.hr-note{width:100%;font-family:var(--font);font-size:13px;padding:10px 12px;border:1px solid var(--border-md);border-radius:11px;min-height:60px;margin-bottom:10px;resize:vertical;background:var(--surface)}
.hr-note:focus{outline:none;border-color:var(--amber)}

/* ── 審閱結果：風險徽章與總評 ── */
.risk-badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;letter-spacing:.3px}
.risk-pass{background:var(--green-bg);color:var(--green-dark)}
.risk-low{background:var(--blue-bg);color:var(--blue-dark)}
.risk-mid{background:var(--amber-bg);color:var(--amber-dark)}
.risk-high{background:var(--red-bg);color:#B91C1C}
.overall-banner{border-radius:var(--r);padding:1rem 1.35rem;margin-bottom:14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;border:1px solid var(--border)}
.overall-banner i{font-size:18px}
.overall-pass{background:var(--green-bg);color:var(--green-dark);border-color:rgba(14,169,104,.25)}
.overall-minor{background:var(--amber-bg);color:var(--amber-dark);border-color:#F6D9A8}
.overall-major{background:var(--red-bg);color:#B91C1C;border-color:rgba(226,63,63,.25)}
.dc-evidence{font-size:12.5px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:7px 10px;margin-top:8px;line-height:1.6}
.sugg-item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--surface2)}
.sugg-issue{font-size:13.5px;font-weight:700;margin-bottom:4px}
.sugg-fix{font-size:13px;color:var(--text2);line-height:1.65}
.sugg-example{font-size:13px;color:var(--green-dark);background:var(--green-bg);border-radius:8px;padding:7px 10px;margin-top:7px;line-height:1.6}
.compliance-note{font-size:12.5px;color:var(--text2);background:var(--surface2);border:1px dashed var(--border-md);border-radius:10px;padding:9px 12px;margin-top:10px;display:flex;gap:7px;align-items:flex-start;line-height:1.6}
.alert-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:20px;margin-top:6px}

.audit-trail{margin-top:1.5rem}
.audit-trail-title{font-size:11.5px;font-weight:800;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.audit-item{font-size:12.5px;color:var(--text2);padding:10px 13px;background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:7px;display:flex;gap:12px;box-shadow:var(--shadow-xs)}
.audit-item .at-time{color:var(--text3);flex-shrink:0}

/* ── CHAT VIEW ── */
.chat-scroll{flex:1;overflow-y:auto;padding:1.5rem 1.5rem .5rem;display:flex;flex-direction:column;gap:14px}
.chat-scroll::-webkit-scrollbar{width:4px}
.chat-scroll::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:4px}

.msg-row{display:flex;gap:9px;align-items:flex-end;width:100%}
.msg-row.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:10px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:2px;box-shadow:0 3px 10px rgba(14,169,104,.28)}
.avatar i{font-size:16px;color:#fff}
.bubble{padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.75;max-width:480px}
.bubble.bot{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;box-shadow:var(--shadow-xs)}
.bubble.user{background:linear-gradient(135deg,#1A2233,#2C3B5C);color:#fff;border-bottom-right-radius:5px;max-width:360px}
.bubble pre{white-space:pre-wrap;font-family:var(--font);font-size:13.5px;margin-top:4px}
mark.hl{background:linear-gradient(180deg,transparent 15%,#FFEC99 15%,#FFEC99 90%,transparent 90%);color:inherit;padding:0 3px;border-radius:3px;font-weight:600}

.stage-label{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:6px}
.sl-collect{background:var(--blue-bg);color:var(--blue-dark)}
.sl-translate{background:var(--purple-bg);color:var(--purple-dark)}
.sl-review{background:var(--amber-bg);color:var(--amber-dark)}

.chips-row{display:flex;flex-wrap:wrap;gap:8px;padding-left:39px}
.chip{padding:8px 16px;border:1px solid var(--border-md);border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text);font-family:var(--font);transition:all .15s}
.chip:hover{border-color:var(--green);color:var(--green-dark);background:var(--green-bg);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.chips-row.disabled .chip{pointer-events:none;opacity:.4}

.typing-row{display:flex;gap:9px;align-items:flex-end}
.typing-bubble{padding:13px 17px;background:var(--surface);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:5px;display:flex;gap:4px;box-shadow:var(--shadow-xs)}
.typing-bubble span{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:blink 1.2s infinite}
.typing-bubble span:nth-child(2){animation-delay:.2s}
.typing-bubble span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}

.input-bar{background:var(--surface);border-top:1px solid var(--border);padding:14px 1.5rem;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.input-wrap{flex:1;border:1px solid var(--border-md);border-radius:16px;background:var(--surface2);display:flex;align-items:flex-end;transition:all .15s}
.input-wrap:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
#user-input{flex:1;font-family:var(--font);font-size:14px;padding:10px 14px;border:none;outline:none;background:transparent;color:var(--text);resize:none;max-height:120px;line-height:1.5}
.send-btn{width:38px;height:38px;margin:4px;border-radius:11px;background:var(--brand-grad);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;box-shadow:var(--shadow-sm)}
.send-btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.send-btn:disabled{background:var(--border-md);box-shadow:none;cursor:not-allowed}
.send-btn i{font-size:17px;color:#fff}

/* ── RESULT CARDS (used by 收集/轉譯/審閱 views) ── */
.detail-hero{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:1.35rem 1.5rem;margin-bottom:1.25rem;
  display:flex;align-items:flex-start;gap:16px;box-shadow:var(--shadow-sm);
}
.detail-icon{width:46px;height:46px;border-radius:13px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detail-icon i{font-size:22px;color:var(--green)}
.detail-hero-name{font-family:var(--font-display);font-size:19px;font-weight:800;margin-bottom:5px}
.detail-hero-sub{font-size:13.5px;color:var(--text2);line-height:1.6}
.detail-hero-sub.loading{color:var(--text3);font-size:13px;display:flex;align-items:center;gap:8px}

/* ── 收集：客觀數據／機會風險列表 ── */
#dc-objective,#dc-product,#dc-marketing{white-space:normal}
.od-item{padding:10px 0;border-bottom:1px solid var(--border)}
.od-item:last-child{border-bottom:none;padding-bottom:0}
.od-item:first-child{padding-top:0}
.od-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.od-label{font-size:13.5px;font-weight:700;color:var(--text)}
.od-desc{font-size:13.5px;color:var(--text2);line-height:1.65}
.od-source{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--blue-dark);text-decoration:none;margin-top:6px}
.od-source:hover{text-decoration:underline}
.od-source i{font-size:12px}
.or-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.or-item:last-child{margin-bottom:0}
.or-item .risk-badge{flex-shrink:0;margin-top:1px;margin-left:0}
.or-text{font-size:14px;color:var(--text);line-height:1.65}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:580px){.detail-grid{grid-template-columns:1fr}}

.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.35rem;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.detail-card:hover{box-shadow:var(--shadow-md)}
.detail-card.full{grid-column:1/-1}
.dc-title{font-size:11.5px;font-weight:800;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:7px;letter-spacing:.4px;text-transform:uppercase}
.dc-title i{font-size:14px;color:var(--green)}
#collect-result .dc-title i{color:var(--blue)}
#translate-result .dc-title i{color:var(--purple)}
#review-result .dc-title i{color:var(--amber)}
.dc-body{font-size:14px;color:var(--text);line-height:1.75;white-space:pre-wrap}
.dc-body.loading{color:var(--text3);font-size:13px;display:flex;align-items:center;gap:8px}

.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:1.25rem}
.action-btn{
  padding:10px 18px;border-radius:12px;font-family:var(--font);font-size:13.5px;
  font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;border:none;
  transition:all .15s;
}
.action-btn.primary{background:var(--brand-grad);color:#fff;box-shadow:var(--shadow-sm)}
.action-btn.primary:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.action-btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-md)}
.action-btn.secondary:hover{background:var(--surface2);border-color:var(--green)}
.action-btn i{font-size:15px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,25,0.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--surface);border-radius:22px;padding:2rem;width:90%;max-width:420px;box-shadow:var(--shadow-lg)}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:800;margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:1.25rem;line-height:1.6}
.modal input{width:100%;font-family:var(--font);font-size:14px;padding:11px 14px;border:1px solid var(--border-md);border-radius:12px;outline:none;color:var(--text);margin-bottom:1rem}
.modal input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.modal-btn{width:100%;padding:11px;background:var(--brand-grad);color:#fff;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);transition:all .15s}
.modal-btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.modal-link{width:100%;margin-top:10px;padding:8px;background:transparent;color:var(--text2);border:none;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.modal-link:hover{color:var(--green-dark)}

/* ── 轉譯：類型選擇卡 ── */
.type-select-row{display:flex;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
.type-card{
  flex:1;min-width:220px;display:flex;align-items:center;gap:12px;text-align:left;
  padding:14px 16px;border:1px solid var(--border-md);border-radius:var(--r);
  background:var(--surface);cursor:pointer;font-family:var(--font);transition:all .15s;
}
.type-card:hover{border-color:var(--purple);background:var(--purple-bg);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.type-card-icon{width:38px;height:38px;border-radius:11px;background:var(--purple-bg);color:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.type-card-icon i{font-size:18px}
.type-card-name{font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px}
.type-card-desc{font-size:11.5px;color:var(--text3);line-height:1.5}

/* ── 轉譯：健康文章 ── */
.article-meta{font-size:11px;font-weight:800;color:var(--purple-dark);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.article-title{font-family:var(--font-display);font-size:19px;font-weight:800;line-height:1.4;margin-bottom:4px;padding-right:70px}
.article-date{font-size:11.5px;color:var(--text3);margin-bottom:14px}
.article-intro{font-size:14px;color:var(--text2);line-height:1.8;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.article-section{margin-bottom:16px}
.article-h2{font-size:14.5px;font-weight:800;color:var(--text);padding-left:10px;border-left:3px solid var(--purple);margin-bottom:8px}
.article-body{font-size:14px;color:var(--text);line-height:1.85;white-space:pre-wrap}
.article-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.article-list li{font-size:14px;color:var(--text);line-height:1.7;padding-left:20px;position:relative}
.article-list li::before{content:'';position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--purple)}
.article-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:2px}
.article-table th{background:var(--purple-bg);color:var(--purple-dark);font-weight:800;text-align:left;padding:8px 12px;border:1px solid var(--border)}
.article-table td{padding:8px 12px;border:1px solid var(--border);color:var(--text);line-height:1.5}
.article-table tr:nth-child(even) td{background:var(--surface2)}
.article-think{background:var(--purple-bg);border-radius:12px;padding:14px 16px;margin:16px 0;line-height:1.75}
.article-think-label{font-size:12px;font-weight:800;color:var(--purple-dark);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.article-think-body{font-size:13.5px;color:var(--text)}
.article-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.article-tag{font-size:11.5px;font-weight:700;color:var(--purple-dark);background:var(--purple-bg);padding:3px 10px;border-radius:20px}
.article-refs{border-top:1px solid var(--border);padding-top:12px}
.article-refs-label{font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px}
.article-ref-item{font-size:12px;color:var(--text2);line-height:1.9}
.article-ref-item a{color:var(--blue-dark);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.article-ref-item a:hover{text-decoration:underline}
.article-ref-item a i{font-size:11px}

/* ── 轉譯：健康圖卡 v3（1080×1080 固定方形・編輯風資訊圖；採自 claude design/健康圖文樣式.dc.html；規範見 DESIGN.md §7） ── */
.infocard-scale-wrap{overflow:hidden;border-radius:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border-md)}
.infocard-canvas{
  width:1080px;height:1080px;position:relative;overflow:hidden;
  background:#fbfaf5;color:#1c2620;
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --icg-deep:#17603f;--icg:#2e7d51;--icg-mid:#4f9e6e;--icg-soft:#7cb98f;
  --ic-ink:#1c2620;--ic-ink-soft:#3f5346;--ic-ink-mute:#6d8460;
  --ic-tint-a:#f1f2ee;--ic-tint-b:#eaf3e2;--ic-hair:#cfe0b8;
}
.infocard-canvas.compact{zoom:.404}
.infocard-canvas *{box-sizing:border-box}

/* 背景大橢圓（左上出血）+ 一條細描邊 */
.infocard-canvas .ic-bg-ellipse{position:absolute;top:-190px;left:-200px;width:1520px;height:640px;border-radius:50%;background:linear-gradient(180deg,#e9f1de 0%,#f4f7ec 100%);z-index:0;pointer-events:none}
.infocard-canvas .ic-bg-ellipse::after{content:"";position:absolute;inset:-30px -20px 0;border-radius:50%;border-bottom:3px solid #c6dcaa}

/* header 96px：深綠 + 同色調圓 + logo + 描邊標籤 */
.infocard-topbar{position:absolute;top:0;left:0;right:0;height:96px;background:var(--icg-deep);overflow:hidden;z-index:2;display:flex;align-items:center;padding:0 48px}
.infocard-topbar .ic-tb-deco{position:absolute;border-radius:50%;pointer-events:none}
.infocard-topbar .ic-tb-deco.d1{width:300px;height:300px;top:-130px;right:130px;background:#1c7049}
.infocard-topbar .ic-tb-deco.d2{width:240px;height:240px;top:36px;right:-70px;background:#2e7d51}
.infocard-topbar .ic-tb-main{position:relative;z-index:1;display:flex;align-items:center;gap:18px;width:100%}
.infocard-topbar .logo-badge{width:60px;height:60px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.infocard-topbar .logo-badge i{font-size:30px;color:var(--icg-deep)}
.infocard-topbar .logo-badge svg{width:40px;height:40px;display:block;color:var(--icg-deep)}
.infocard-topbar .brand-name{font-size:29px;font-weight:900;letter-spacing:.06em;color:#fff}
.infocard-topbar .ic-tb-tag{margin-left:auto;padding:9px 26px;border-radius:999px;border:2px solid #77b795;font-size:21px;font-weight:700;letter-spacing:.08em;color:#d7ecdf;white-space:nowrap}

/* 內容區：header 與 footer 之間，flex 直排 */
.infocard-canvas-body{position:absolute;top:96px;left:0;right:0;bottom:92px;z-index:1;overflow:hidden;display:flex;flex-direction:column;padding:18px 48px 12px}
.infocard-canvas-hook{font-size:43px;font-weight:900;line-height:1.15;letter-spacing:.01em;color:var(--icg);margin-bottom:2px}
.infocard-canvas-main{font-size:44px;font-weight:900;line-height:1.14;letter-spacing:.01em;color:var(--icg-deep);margin:0}
.infocard-canvas .ic-meta{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:20px;font-weight:500;letter-spacing:.04em;color:var(--ic-ink-mute)}
.infocard-canvas .ic-meta::before{content:"";width:34px;height:3px;background:var(--icg-soft);flex-shrink:0}
.infocard-canvas-intro{font-size:20px;font-weight:400;line-height:1.55;color:var(--ic-ink-soft);margin-top:10px}
.infocard-canvas .ic-em{font-weight:700;border-bottom:2px solid var(--icg)}

/* 區段標頭：膠囊 + 橫線 + 端點 */
.infocard-canvas .ic-section-head{display:flex;align-items:center;margin:11px 0 8px}
.infocard-canvas .ic-section-head .lbl{flex-shrink:0;padding:8px 30px;border-radius:999px;background:var(--icg);color:#fff;font-size:24px;font-weight:700;letter-spacing:.05em}
.infocard-canvas .ic-section-head .rule{flex:1;height:3px;background:var(--icg)}
.infocard-canvas .ic-section-head .dot{width:13px;height:13px;border-radius:50%;background:var(--icg);flex-shrink:0}

/* 下半 2 欄（區段2 提高警覺 ｜ 區段3 日常這樣做）*/
.infocard-canvas .ic-2col{display:flex;gap:28px;margin-top:2px;flex:1;min-height:0}
.infocard-canvas .ic-2col > .ic-col{display:flex;flex-direction:column;min-width:0}
.infocard-canvas .ic-2col > .ic-col.l{flex:1.08}
.infocard-canvas .ic-2col > .ic-col.r{flex:1}
.infocard-canvas .ic-2col .ic-section-head{margin:0 0 9px}
.infocard-canvas .ic-2col .ic-section-head .lbl{font-size:22px;padding:7px 24px}

/* 表格（含表頭）*/
.infocard-canvas .ic-table{display:flex;flex-direction:column}
.infocard-canvas .ic-table .ic-th{display:flex;padding:0 4px 6px;font-size:18px;font-weight:500;color:var(--ic-ink-mute)}
.infocard-canvas .ic-table .ic-th .c1{width:284px;flex:none}
.infocard-canvas .ic-table .ic-tr{display:flex;align-items:stretch;background:var(--ic-tint-a)}
.infocard-canvas .ic-table .ic-tr:nth-child(even){background:var(--ic-tint-b)}
.infocard-canvas .ic-table .ic-tr .c1{width:284px;flex:none;padding:7px 18px;font-size:21px;font-weight:700;color:var(--icg-deep);display:flex;align-items:center;line-height:1.25}
.infocard-canvas .ic-table .ic-tr .c2{flex:1;padding:7px 18px;font-size:19px;line-height:1.34;color:var(--ic-ink);display:flex;align-items:center}

/* 統計條（漸層綠）*/
.infocard-canvas .ic-stats{display:flex;flex-direction:column;gap:9px}
.infocard-canvas .ic-stat{display:flex;align-items:baseline;gap:14px;border-radius:10px;padding:11px 22px;color:#fff}
.infocard-canvas .ic-stat:nth-child(1){background:var(--icg-deep)}
.infocard-canvas .ic-stat:nth-child(2){background:var(--icg)}
.infocard-canvas .ic-stat:nth-child(3){background:var(--icg-mid)}
.infocard-canvas .ic-stat .sv{font-size:40px;font-weight:900;line-height:1;flex-shrink:0}
.infocard-canvas .ic-stat .sl{font-size:18px;font-weight:500;line-height:1.3}
.infocard-canvas .ic-stats-note{margin-top:10px;font-size:16px;line-height:1.55;color:var(--ic-ink-mute)}

/* 編號清單（縱向）*/
.infocard-canvas .ic-nlist{display:flex;flex-direction:column;gap:11px}
.infocard-canvas .ic-nli{display:flex;gap:13px;align-items:flex-start}
.infocard-canvas .ic-nli .n{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--icg);color:#fff;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px}
.infocard-canvas .ic-nli .t{font-size:20px;line-height:1.48;color:var(--ic-ink)}

/* label 列（rows fallback）*/
.infocard-canvas .ic-rows{display:flex;flex-direction:column;gap:8px}
.infocard-canvas .ic-row{display:flex;align-items:stretch;background:var(--ic-tint-a)}
.infocard-canvas .ic-row:nth-child(even){background:var(--ic-tint-b)}
.infocard-canvas .ic-row .k{width:156px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 10px;font-size:23px;font-weight:700;line-height:1.3;color:var(--icg-deep)}
.infocard-canvas .ic-row .v{flex:1;padding:10px 20px;font-size:21px;line-height:1.5;color:var(--ic-ink)}

/* steps 格線 / flow 膠囊（保留給其他排版）*/
.infocard-canvas .ic-steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:20px}
.infocard-canvas .ic-step{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.infocard-canvas .ic-step .num{width:56px;height:56px;border-radius:50%;background:var(--icg);color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center}
.infocard-canvas .ic-step .cap{font-size:21px;font-weight:500;line-height:1.35;color:var(--ic-ink)}
.infocard-canvas .ic-flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px}
.infocard-canvas .ic-flow-chip{background:#fff;border:1px solid var(--ic-hair);border-radius:14px;padding:14px 22px;text-align:center}
.infocard-canvas .ic-flow-chip .fv{display:block;font-size:23px;font-weight:700;color:var(--ic-ink)}
.infocard-canvas .ic-flow-chip .fl{display:block;font-size:17px;color:var(--ic-ink-mute);margin-top:2px}
.infocard-canvas .ic-flow-arrow{font-size:22px;color:var(--icg)}

/* footer 100px：左 hashtag + 資料來源｜右 品牌標記 */
.infocard-canvas-footer{position:absolute;bottom:0;left:0;right:0;height:92px;background:#f3f5ee;border-top:1px solid #dbe3d3;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 48px}
.infocard-canvas-footer .ic-ft-tags{display:flex;flex-direction:column;gap:5px;min-width:0}
.infocard-canvas-footer .ic-ft-hash{font-size:19px;font-weight:700;letter-spacing:.02em;color:var(--icg)}
.infocard-canvas-footer .ic-ft-src{font-size:14px;color:var(--ic-ink-mute)}
.infocard-canvas-footer .ic-ft-brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;letter-spacing:.04em;color:var(--icg);flex-shrink:0}
.infocard-canvas-footer .ic-ft-brand svg{width:36px;height:36px;display:block;flex-shrink:0}

/* ── 轉譯：文章預覽 ／ PDF 匯出 ── */
.preview-modal{background:var(--surface);border-radius:18px;width:min(820px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
.preview-modal.wide{width:min(1160px,96vw)}
.preview-modal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.preview-modal-title{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.preview-modal-actions{display:flex;gap:8px}
.preview-modal-scroll{flex:1;overflow-y:auto;padding:28px;background:var(--surface2)}
.print-page{background:#fff;max-width:720px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.1);color:#111827;border-radius:4px;overflow:hidden}
.print-header-bar{background:var(--brand-grad);color:#fff;font-size:12.5px;font-weight:800;padding:11px 32px;letter-spacing:.3px}
.print-body-pad{padding:32px}
.print-title{font-family:var(--font-display);font-size:22px;font-weight:800;margin-bottom:6px;line-height:1.45}
.print-date{font-size:12px;color:#6b7280;margin-bottom:20px}
.print-intro{font-size:14px;line-height:1.9;color:#374151;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #e5e7eb}
.print-think{background:var(--green-bg);border-radius:10px;padding:16px 18px;margin:24px 0;font-size:13.5px;line-height:1.85;color:#111827}
.print-think-label{font-size:12px;font-weight:800;color:var(--green-dark);margin-bottom:6px}
.print-tags{font-size:11.5px;color:var(--green-dark);margin-bottom:22px;line-height:1.8}
.print-refs-label{font-size:11px;font-weight:800;color:#9CA3AF;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.print-ref-item{font-size:11.5px;color:#6b7280;line-height:1.9}
.print-ref-item a{color:#1D53C4;font-weight:600;text-decoration:none}
.print-ref-item a:hover{text-decoration:underline}
.print-ref-item a i{font-size:10px;margin-left:2px}
.print-footer-bar{background:var(--brand-grad);color:#fff;font-size:10.5px;font-weight:700;padding:11px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px}

.status-pill.demo{color:var(--amber-dark);background:var(--amber-bg)}
.demo-hint{font-size:12px;font-weight:600;color:var(--amber-dark);background:var(--amber-bg);border:1px solid #F6D9A8;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:6px}

.spinner-sm{display:inline-block;width:13px;height:13px;border:2px solid var(--border-md);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">啟用 AI 功能</div>
    <div class="modal-sub">請輸入 Anthropic API Key 以啟動平台。金鑰僅用於本頁面的 AI 呼叫，不會儲存至任何伺服器。</div>
    <input type="password" id="api-key-input" placeholder="sk-ant-…" autocomplete="off"/>
    <button class="modal-btn" onclick="saveKey()">確認啟用</button>
    <button class="modal-link" onclick="enterDemoMode()">先看範例效果，不需要 API Key</button>
  </div>
</div>

<!-- ARTICLE PREVIEW / PDF MODAL -->
<div class="modal-overlay hidden" id="article-preview-modal">
  <div class="preview-modal">
    <div class="preview-modal-toolbar">
      <div class="preview-modal-title"><i class="ti ti-file-text"></i>文章預覽</div>
      <div class="preview-modal-actions">
        <button class="action-btn secondary" onclick="downloadArticleDocx(this)"><i class="ti ti-file-type-docx"></i>下載 Word</button>
        <button class="action-btn secondary" onclick="downloadArticlePDF(this)"><i class="ti ti-download"></i>下載 PDF</button>
        <button class="icon-btn" onclick="closeArticlePreview()"><i class="ti ti-x"></i>關閉</button>
      </div>
    </div>
    <div class="preview-modal-scroll">
      <div id="article-print-page" class="print-page"></div>
    </div>
  </div>
</div>

<!-- INFOCARD PREVIEW / IMAGE EXPORT MODAL -->
<div class="modal-overlay hidden" id="infocard-preview-modal">
  <div class="preview-modal wide">
    <div class="preview-modal-toolbar">
      <div class="preview-modal-title"><i class="ti ti-photo"></i>圖卡預覽</div>
      <div class="preview-modal-actions">
        <button class="action-btn secondary" onclick="downloadInfocardImage(this)"><i class="ti ti-download"></i>下載圖片</button>
        <button class="icon-btn" onclick="closeInfocardPreview()"><i class="ti ti-x"></i>關閉</button>
      </div>
    </div>
    <div class="preview-modal-scroll">
      <div id="infocard-canvas-full" class="infocard-canvas"></div>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo"><i class="ti ti-brain"></i></div>
  <div class="topbar-name">健康智慧中樞</div>
  <div class="topbar-sub">收集・轉譯・審閱</div>
  <div class="topbar-right">
    <div class="status-pill" id="status-pill" style="display:none"><span class="status-dot"></span>AI 已啟用</div>
    <div class="status-pill demo" id="demo-pill" style="display:none">🧪 示範模式・範例資料</div>
    <button class="icon-btn" onclick="showModal()"><i class="ti ti-key" style="font-size:13px"></i>API Key</button>
  </div>
</div>

<!-- BODY -->
<div class="body-wrap">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="nav-tabs">
      <button class="nav-tab active" data-view="chat" onclick="switchView('chat')"><span class="nav-ico"><i class="ti ti-message-circle"></i></span>AI 對話</button>
      <button class="nav-tab" data-view="collect" onclick="switchView('collect')"><span class="nav-ico"><i class="ti ti-radar"></i></span>收集</button>
      <button class="nav-tab" data-view="translate" onclick="switchView('translate')"><span class="nav-ico"><i class="ti ti-language"></i></span>轉譯</button>
      <button class="nav-tab" data-view="review" onclick="switchView('review')"><span class="nav-ico"><i class="ti ti-shield-check"></i></span>審閱</button>
    </div>

用詞統一：醫師（不寫醫生）、患者（不寫病患／病人）、民眾（泛稱一般大眾時使用，不與「患者」混用）；全文用詞需前後一致，不得同一篇文章交替使用同義詞造成混亂

## 類型定義（依「類型」參數切換格式，只能二選一）

【健康文章】比照衛教長文／電子報／官網文章規格，架構固定五段。參考範本的寫法邏輯：第一段引言說明「這個主題為什麼重要、讀者該知道什麼」；第二段依主題性質，用最適合的方式整理重點（規格／標準／分類類主題用表格，例如判定標準、藥物種類比較；原則／做法／趨勢類主題用條列，例如注意事項、日常建議）；第三段智庫觀點回扣主題給出建議。
- title：標題，含吸睛副標或情境提問（例如「常常睡不好？教你正確使用安眠藥！」），15-25字
- intro：引言，80-140字。以一個現象或情境破題，說明議題與讀者的關聯，段末點出本文將介紹的內容
- sections：內文，固定 2-4 個小節，每節 { heading（8-14字的小節標題）, format（"text"或"bullets"或"table"三選一，依內容性質決定，同一篇文章可混用不同format）, body（format為"text"時填寫，120-220字的說明文字）, items（format為"bullets"時填寫，3-5條字串，每條30-60字，重點在前）, table（format為"table"時填寫，{headers:[欄位名稱,...]（2-3欄）, rows:[[儲存格,...],...]}（3-6列），適合有明確分類或數值對照的內容，例如判定標準、藥物比較、時程表） }。小節之間需有邏輯順序（例如：現況說明→標準或分類→實際做法），避免內容重複
- think_tank_view：智庫觀點，100-160字，結構固定兩部分：先一句話總結全文重點（這個議題對讀者的意義是什麼），再給一個讀者現在就能做的具體行動建議；語氣像衛教專家跟讀者說話，不是內部報告。預設不主動帶入保單／商品／服務資訊——除非議題本身就是以商品或服務為主題，否則不需要為了業配硬塞保單相關字句，也不需要附加法遵免責聲明（那屬於guardrail 3的例外情況，不是預設情況）
- hashtags：5-7個關鍵字標籤（不含 # 符號），涵蓋議題分類與核心關鍵詞
- references：3-4筆參考資料，每筆 { title（文章或政策標題，須為該來源實際可能刊登的標題語氣，不得捏造聳動假標題）, source（機構或媒體名稱，須從上方可信來源清單中選擇）, url（可省略，僅在你有相當把握該網址真實存在且對應這篇文章時才填寫；沒有把握時寧可省略此欄位，也不得為了讓參考資料看起來完整而捏造網址） }

【健康圖卡】成品是 1080×1080 固定方形的「編輯風資訊圖」，資訊密度要跟一篇衛教短文一樣紮實，只是壓縮成 3 個區段呈現。**內容深度是重點：要有具體的判定標準、具體的數字、具體的做法，不要只寫「多留意」「調整習慣」這種空話。** 架構固定：
- headline_hook：破題提問，≤14字（例如「代謝症候群是什麼？」）
- headline_main：本卡重點，≤18字，資訊性優先於口號（例如「「三高＋二害」判定標準一次看」）
- intro：2句，≤60字。第一句用一個具體數字或現況破題（盛行率、比例、人數級距），第二句點出本卡要講的三件事
- sections：**固定 3 個區段**，依序如下（heading 為 4-6 字短語）：
  · 區段1「標準／知識」：整寬呈現。format 一律 "table"，table = { headers:["欄位1","欄位2"]（2 欄）, rows:[["項目","具體數值或標準"], ...]（4-6 列）}。放這個議題實際的判定標準、分級、對照數值——例如診斷切點、藥物分類、篩檢時程；有真實標準就照真實標準寫，數值要完整（含單位、性別差異、但書）
  · 區段2「為何要留意」：format 一律 "stats"，stats = [{value:"簡短數值",label:"這個數值代表什麼"}]（2-3 個；value 如「24.8%」「2-6倍」「近5成」），另附 note（≤40字，補充年份／來源／族群差異）。數值必須來自可信機構的公開統計，且在 note 標明年份；查無把握就少放一個，不要湊數
  · 區段3「日常這樣做」：format 一律 "list"，items = [字串]（4 條，每條 ≤32字）。每條都要具體可執行、帶量化資訊（頻率／時間／份量），例如「每週至少5次、每次30分鐘規律運動」，不要寫「適度運動」
  · 若某句要標重點，用 **雙星號** 框住該詞（會顯示為底線強調），一個區段最多 2 處
- hashtags：4-6 個關鍵字（不含 #），涵蓋議題分類與核心關鍵詞
- sources：2-4 個機構／媒體名稱（字串陣列），從下方「可信來源清單」中選；會顯示在頁尾「資料來源：」
- illustration_category：仍需填（供文字稿與分類用，方形版面不顯示配圖）：sleep｜heart｜brain｜bones-joints｜mental-wellbeing｜screening-checkup｜virus-infection｜elderly-care｜general

只輸出一個 JSON 物件，不加任何前言或 markdown 圍欄。依「類型」只填該類型對應欄位，不得輸出另一類型的欄位：

## 護欄規則（違反任一條即為不合格產出）
1. 禁用詞：保證、治癒、根治、絕對、一定、最高、最優、第一、唯一、零風險、穩賺
2. 不得出現療效保證：「及早發現」可以，「及早治癒」不可以；「有助改善」可以，「能有效改善」需避免
3. 若內容確實提到投保、理賠、保費等具體陳述，一律加註「詳細以保單條款為準」或同義句（健康文章放在 think_tank_view 或最後一個 section；健康圖卡放在第 3 區段最後一條 item）；但多數內容屬純衛教建議，不需要為了套這條規則而勉強帶入保單資訊
4. 不指名具體商品名稱、不出現具體保費金額或報酬率
5. 不使用恐嚇式訴求（如「再不注意就來不及了」）
6. 內容若涉及商品或服務，結尾必須包含免責聲明；純衛教內容可免，但 disclaimer_included 須如實填 false
7. 議題涉及重大疾病（癌症、失智等）時語氣需莊重，健康圖卡不使用表情符號
8. 健康圖卡的 table 數值、stats 數值與 note 年份，沒有把握查證時一律用保守級距或少放一項，不得為了版面完整掰造數字、年份或來源；sources 只能填實際引用到的機構／媒體`,

## 審閱立場
- 從嚴：有疑慮時寧可標高一級風險，由人工複審者降級，不可反向
- 你不是最終決策者：產出為「預審意見」，措辭使用「建議」「疑慮」，不使用「駁回」「禁止發布」
- 語言：繁體中文，不使用 markdown 符號

## 四維度檢核標準
【醫療正確性】檢查疾病機轉描述是否符合現行衛教共識、數據是否合理、有無過時或錯誤醫療觀念。高風險＝明確錯誤的醫療陳述或療效保證用語（治癒、根治）；中風險＝陳述過於絕對（「一定會」「必然導致」）或引用來源不明的具體數據；低風險＝用語不夠精確但不致誤導；通過＝陳述與現行衛教資訊一致且程度用語恰當。
【保險法遵合規】禁用詞：保證、治癒、根治、絕對、一定賺、最高、最優、第一、唯一、零風險、穩賺。高風險＝出現禁用詞、療效或收益保證、與事實不符的商品描述；中風險＝涉及投保理賠陳述但未加註「以保單條款為準」、商品資訊揭露不完整；低風險＝用語接近但未達禁用程度（如「非常有效」）；通過＝無禁用語且必要揭露完整。
【品牌語調一致性】品牌基準：專業、溫暖、值得信賴；不油腔滑調、不恐嚇、不輕浮。高風險＝恐嚇式訴求、貶低同業、嚴重衝突用語；中風險＝語氣與目標場景不符；低風險＝個別用詞可再優化；通過＝語調符合基準與場景。
【受眾適切性】檢查內容難度與目標受眾理解程度是否匹配、有無排除或冒犯特定族群的表達。高風險＝可能冒犯或歧視特定族群；中風險＝專業術語未解釋、比喻過於抽象；低風險＝可讀性可再提升但不影響理解；通過＝難度匹配且表達包容。

## 輸出格式契約
只輸出一個 JSON 物件，不加任何前言或 markdown 圍欄：
{
  "overall": "pass或minor_revision或major_revision",
  "overall_reason": "一句話總評",
  "dimensions": [
    {"name":"醫療正確性","level":"通過或低風險或中風險或高風險","reason":"判定理由1-2句","evidence":"逐字引用原文具體字句；若通過填「無」"},
    {"name":"保險法遵合規", "level":"…","reason":"…","evidence":"…"},
    {"name":"品牌語調一致性","level":"…","reason":"…","evidence":"…"},
    {"name":"受眾適切性","level":"…","reason":"…","evidence":"…"}
  ],
  "suggestions": [
    {"issue":"問題描述","severity":"high或medium或low","fix":"修正方向","example":"針對 evidence 原句的可直接取用改寫句"}
  ]
}
欄位規則：
- dimensions 固定 4 項且順序固定
- overall 判定：任一維度高風險 → major_revision；僅中低風險 → minor_revision；全數通過 → pass
- suggestions 依 severity 由高至低排序，2-4 條；全數通過時為空陣列
- 每條 example 必須是可直接取用的改寫句，不是抽象描述

/* JSON 回應解析（去除模型偶爾附加的 code fence） */
function parseAI(raw){
  const cleaned = raw.replace(/```json|```/g,'').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if(start === -1 || end === -1) throw new Error('AI 回應格式異常，請重試');
  const obj = JSON.parse(cleaned.slice(start, end+1));
  if(obj.error) throw new Error(obj.error);
  return obj;
}

function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px' }

async function ai(system, msg){
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01'},
    body: JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2500,system,messages:[{role:'user',content:msg}]})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.content?.map(b=>b.text||'').join('')||'';
}

async function loadTopics(){
  if(DEMO_MODE){ renderTopics(FALLBACK_TOPICS); return; }
  if(!API_KEY){ return; }
  const list = document.getElementById('sidebar-list');
  list.innerHTML = '<div class="sidebar-loading"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  try{
    const raw = await ai(
      `你是台灣健康促進與保險產業的議題分析師。請輸出 JSON，不要有任何說明或 markdown，直接從 [ 開始。`,
      `請列出目前台灣最值得保險公司關注的 7 個健康議題。
每個議題輸出以下 JSON 格式（陣列）：
[
  {"name":"議題名稱（10字內）","summary":"一句話摘要（20字內）","tag":"hot或trend或risk或policy其中一個"}
]`
    );
    let topics;
    try{
      const cleaned = raw.replace(/```json|```/g,'').trim();
      topics = JSON.parse(cleaned);
    }catch{
      topics = FALLBACK_TOPICS;
    }
    renderTopics(topics);
  }catch(e){
    list.innerHTML = `<div style="padding:16px 14px;font-size:13px;color:var(--text3)">載入失敗<br/><span style="font-size:12px">${esc(e.message)}</span></div>`;
  }
}

function renderTopics(topics){
  const list = document.getElementById('sidebar-list');
  list.innerHTML='';
  topics.forEach((t,i)=>{
    const item = document.createElement('div');
    item.className='topic-item';
    item.dataset.idx = i;
    item.innerHTML=`
      <div class="topic-tag ${TAG_MAP[t.tag]||'tag-trend'}">${TAG_LABEL[t.tag]||'趨勢'}</div>
      <div class="topic-name">${esc(t.name)}</div>
      <div class="topic-meta">${esc(t.summary)}</div>
    `;
    item.onclick = ()=>{
      document.querySelectorAll('.topic-item').forEach(el=>el.classList.remove('active'));
      item.classList.add('active');
      switchView('collect');
      document.getElementById('collect-input').value = t.name;
      runCollect(t.name, t);
    };
    list.appendChild(item);
  });
}

  if(/骨|關節|肌少|膝蓋|腰痛|肩頸|退化性/.test(topic)) return 'bones-joints';
  if(/心理|情緒|壓力|憂鬱|焦慮/.test(topic)) return 'mental-wellbeing';

function switchView(name){
  currentView = name;
  document.querySelectorAll('.view-panel').forEach(el=>el.classList.remove('active'));
  document.getElementById(name+'-view').classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.toggle('active', el.dataset.view===name));
}

async function runCollect(topicOverride, topicObj){
  if(!API_KEY && !DEMO_MODE){ showModal(); return; }
  const input = document.getElementById('collect-input');
  const topic = (topicOverride || input.value.trim());
  if(!topic){ alert('請輸入健康議題'); return; }
  input.value = topic;

function copyText(text, btn){
  navigator.clipboard.writeText(text||'').then(()=>{
    if(btn){ const orig=btn.innerHTML; btn.innerHTML='<i class="ti ti-check"></i>已複製'; setTimeout(()=>{ btn.innerHTML=orig; },1500); }
  });
}

function fillTpl(val, topic, dateStr){
  if(typeof val === 'string') return val.replace(/\{topic\}/g, topic).replace(/\{date\}/g, dateStr);
  if(Array.isArray(val)) return val.map(v=>fillTpl(v, topic, dateStr));
  if(val && typeof val === 'object'){
    const out = {};
    for(const k in val) out[k] = fillTpl(val[k], topic, dateStr);
    return out;
  }
  return val;
}

function sectionBodyText(s){
  if(s.format==='table' && s.table){
    const header = (s.table.headers||[]).join(' | ');
    const rows = (s.table.rows||[]).map(r=>r.join(' | ')).join('\n');
    return `${header}\n${rows}`;
  }
  if(s.format==='bullets' && s.items){
    return s.items.map(it=>`・${it}`).join('\n');
  }
  return s.body || '';
}

function toPlainText(data){
  if(data.content_type === '健康圖卡'){
    const secs = (data.sections || (data.cards||[])).map(s=>{
      let body;
      if(s.format==='table' && s.table){
        body = (s.table.rows||[]).map(r=>`・${r[0]}：${String(r[1]).replace(/\*\*/g,'')}`).join('\n');
      } else if(s.format==='stats'){
        body = (s.stats||[]).map(x=>`・${x.value}　${x.label}`).join('\n') + (s.note?`\n（${String(s.note).replace(/\*\*/g,'')}）`:'');
      } else if(s.format==='list'){
        body = (s.items||[]).map((it,i)=>`${i+1}. ${String(typeof it==='string'?it:(it.text||it.label||'')).replace(/\*\*/g,'')}`).join('\n');
      } else {
        body = (s.items||[]).map(it=>`・${it.label}${it.desc?`：${it.desc}`:''}${it.stat?`（${it.stat}）`:''}`).join('\n');
      }
      return `【${s.heading}】\n${body}`;
    }).join('\n\n');
    const tags = (data.hashtags||[]).map(h=>'#'+h).join('　');
    const srcs = (data.sources || (data.references||[]).map(r=>r.source)).filter(Boolean);
    return `${data.headline_hook||''}\n${data.headline_main||''}\n\n${data.intro||''}\n\n${secs}\n\n${tags}${srcs.length?`\n\n資料來源：${[...new Set(srcs)].join('、')}`:''}`;
  }
  const secs = (data.sections||[]).map(s=>`■ ${s.heading}\n${sectionBodyText(s)}`).join('\n\n');
  const tags = (data.hashtags||[]).map(h=>'#'+h).join('');
  const refs = (data.references||[]).map(r=>`${r.title}－${r.source}${r.url?`（${r.url}）`:''}`).join('\n');
  return `${data.title}\n最後更新日期：${data.update_date}\n\n${data.intro}\n\n${secs}\n\n【智庫觀點】\n${data.think_tank_view}\n\n${tags}\n\n資料來源\n${refs}`;
}

function sectionBodyHTML(s){

  }
  return `<div class="article-body">${esc(s.body)}</div>`;
}

/* 內嵌中文字型，供 jsPDF 產出可選取／複製文字的 PDF（非截圖點陣圖）。字型檔約12MB，首次下載會快取於記憶體，同一頁面內不重複抓取。 */
let cjkFontBase64 = null;
async function loadCJKFont(){
  if(cjkFontBase64) return cjkFontBase64;
  const res = await fetch('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf');
  if(!res.ok) throw new Error('中文字型載入失敗（HTTP '+res.status+'）');
  const buf = await res.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  cjkFontBase64 = btoa(binary);
  return cjkFontBase64;
}

async function downloadArticlePDF(btn){
  if(!lastArticleData) return;
  const orig = btn.innerHTML;
  btn.disabled = true;
  try{
    btn.innerHTML = '<span class="spinner-sm"></span>載入字型…';
    const fontBase64 = await loadCJKFont();
    btn.innerHTML = '<span class="spinner-sm"></span>產生中…';

    const data = lastArticleData;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    pdf.addFileToVFS('NotoSansTC.ttf', fontBase64);
    pdf.addFont('NotoSansTC.ttf', 'NotoSansTC', 'normal');
    pdf.setFont('NotoSansTC');

    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const marginX = 42, marginBottom = 46;
    const contentW = pageW - marginX*2;
    let y = 0;

    function drawHeaderBar(){
      pdf.setFillColor(14,169,104);
      pdf.rect(0,0,pageW,26,'F');
      pdf.setTextColor(255,255,255);
      pdf.setFont('NotoSansTC'); pdf.setFontSize(10);
      pdf.text('健康智慧中樞・健康智庫', marginX, 17);
      pdf.setTextColor(0,0,0);
      y = 50;
    }
    function ensureSpace(h){
      if(y + h > pageH - marginBottom){ pdf.addPage(); drawHeaderBar(); }
    }
    function boldText(text, x, y, opts){
      pdf.text(text, x, y, opts);
      pdf.text(text, x+0.3, y, opts);
    }
    function paragraph(text, size, gap){
      pdf.setFont('NotoSansTC'); pdf.setFontSize(size);
      const lines = pdf.splitTextToSize(text, contentW);
      const lh = size*1.5;
      lines.forEach(line=>{ ensureSpace(lh); pdf.text(line, marginX, y); y += lh; });
      if(gap) y += gap;
    }
    function heading(text){
      ensureSpace(28);
      pdf.setFillColor(139,92,246);
      pdf.rect(marginX, y-11, 3, 14, 'F');
      pdf.setFont('NotoSansTC'); pdf.setFontSize(13);
      boldText(text, marginX+10, y);
      y += 22;
    }
    function bullets(items){
      pdf.setFont('NotoSansTC'); pdf.setFontSize(10.5);
      const indent = 14;
      items.forEach(it=>{
        const lines = pdf.splitTextToSize(it, contentW-indent);
        lines.forEach((line,i)=>{
          ensureSpace(15);
          if(i===0){ pdf.text('・', marginX, y); }
          pdf.text(line, marginX+indent, y);
          y += 15;
        });
        y += 3;
      });
      y += 6;
    }
    function table(t){
      pdf.autoTable({
        startY: y,
        margin:{left:marginX, right:marginX, bottom:marginBottom},
        head:[t.headers],
        body: t.rows,
        styles:{font:'NotoSansTC', fontSize:9.5, cellPadding:6, textColor:[17,24,39]},
        headStyles:{fillColor:[243,238,255], textColor:[109,63,219]},
        theme:'grid',
        didDrawPage:()=>{ y = 50; }
      });
      y = pdf.lastAutoTable.finalY + 14;
    }

    drawHeaderBar();
    pdf.setFont('NotoSansTC'); pdf.setFontSize(17);
    const titleLines = pdf.splitTextToSize(data.title, contentW);
    titleLines.forEach(line=>{ ensureSpace(22); boldText(line, marginX, y); y += 22; });
    y += 2;
    pdf.setFont('NotoSansTC'); pdf.setFontSize(9.5);
    pdf.setTextColor(0,0,0);
    pdf.text('最後更新日期：'+data.update_date, marginX, y);
    pdf.setTextColor(0,0,0);
    y += 22;

    paragraph(data.intro, 11, 14);

    (data.sections||[]).forEach(s=>{
      heading(s.heading);
      if(s.format==='table' && s.table){ table(s.table); }
      else if(s.format==='bullets' && s.items){ bullets(s.items); }
      else { paragraph(s.body, 10.5, 10); }
    });

    pdf.setFont('NotoSansTC'); pdf.setFontSize(10);
    const thinkLines = pdf.splitTextToSize(data.think_tank_view, contentW-24);
    const boxH = thinkLines.length*14 + 30;
    ensureSpace(boxH);
    pdf.setFillColor(230,249,241);
    pdf.roundedRect(marginX, y, contentW, boxH, 4, 4, 'F');
    pdf.setFontSize(9.5);
    pdf.setTextColor(8,122,76);
    boldText('智庫觀點', marginX+12, y+16);
    pdf.setTextColor(0,0,0);
    pdf.setFontSize(10);
    let ty = y+32;
    thinkLines.forEach(line=>{ pdf.text(line, marginX+12, ty); ty += 14; });
    y += boxH + 16;

    pdf.setFontSize(9);
    pdf.setTextColor(8,122,76);
    const tagsLine = (data.hashtags||[]).map(h=>'#'+h).join('　');
    const tagLines = pdf.splitTextToSize(tagsLine, contentW);
    tagLines.forEach(line=>{ ensureSpace(13); pdf.text(line, marginX, y); y += 13; });
    y += 10;
    pdf.setTextColor(0,0,0);

    ensureSpace(16);
    pdf.setFontSize(9);
    pdf.setTextColor(0,0,0);
    boldText('資料來源', marginX, y);
    y += 14;
    pdf.setTextColor(0,0,0);
    (data.references||[]).forEach(r=>{
      const full = `${r.title}－${r.source}`;
      const lines = pdf.splitTextToSize(full, contentW);
      pdf.setTextColor(...(r.url ? [29,83,196] : [0,0,0]));
      lines.forEach(line=>{
        ensureSpace(13);
        if(r.url){ pdf.textWithLink(line, marginX, y, {url:r.url}); } else { pdf.text(line, marginX, y); }
        y += 13;
      });
    });
    pdf.setTextColor(0,0,0);

    const footerH = 28;
    pdf.setFillColor(14,169,104);
    pdf.rect(0, pageH-footerH, pageW, footerH, 'F');
    pdf.setFont('NotoSansTC'); pdf.setFontSize(8.5);
    pdf.setTextColor(255,255,255);
    pdf.text('製作單位：健康智庫（本文為 AI 輔助產出，發布前請經人工複審）', marginX, pageH-footerH/2+3);
    const rightText = '健康智慧中樞';
    pdf.text(rightText, pageW-marginX-pdf.getTextWidth(rightText), pageH-footerH/2+3);
    pdf.setTextColor(0,0,0);

    const safeName = (data.title||'健康文章').replace(/[\\/:*?"<>|]/g,'');
    pdf.save(`${safeName}.pdf`);
  }catch(e){
    alert('PDF 產生失敗：'+e.message);
  }finally{
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

async function downloadArticleDocx(btn){
  if(!lastArticleData) return;
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span>產生中…';
  try{
    const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, BorderStyle, AlignmentType, ExternalHyperlink } = window.docx;
    const FONT = '微軟正黑體';
    const data = lastArticleData;
    const cellBorder = {style:BorderStyle.SINGLE, size:2, color:'E5E7EB'};
    const cellBorders = {top:cellBorder, bottom:cellBorder, left:cellBorder, right:cellBorder};
    const noBorders = {style:BorderStyle.NONE, size:0, color:'FFFFFF'};

    function brandBar(text){
      return new Table({
        width:{size:100, type:WidthType.PERCENTAGE},
        rows:[new TableRow({children:[new TableCell({
          shading:{fill:'0EA968'},
          margins:{top:120, bottom:120, left:200, right:200},
          borders:{top:noBorders, bottom:noBorders, left:noBorders, right:noBorders},
          children:[new Paragraph({children:[new TextRun({text, font:FONT, bold:true, color:'FFFFFF', size:20})]})]
        })]})],
        borders:{top:noBorders, bottom:noBorders, left:noBorders, right:noBorders, insideHorizontal:noBorders, insideVertical:noBorders}
      });
    }
    function spacer(after){ return new Paragraph({text:'', spacing:{after: after||120}}); }
    function run(text, opts={}){ return new TextRun({text, font:FONT, ...opts}); }

    const children = [];
    children.push(brandBar('健康智慧中樞・健康智庫'));
    children.push(spacer(200));
    children.push(new Paragraph({text:data.title, heading:HeadingLevel.HEADING1}));
    children.push(new Paragraph({children:[run('最後更新日期：'+data.update_date, {color:'6B7280', size:18})], spacing:{after:200}}));
    children.push(new Paragraph({children:[run(data.intro)], spacing:{after:240, line:240}}));

    (data.sections||[]).forEach(s=>{
      children.push(new Paragraph({text:s.heading, heading:HeadingLevel.HEADING2}));
      if(s.format==='table' && s.table){
        const allRows = [s.table.headers, ...s.table.rows];
        const rows = allRows.map((r,ri)=> new TableRow({
          children: r.map(c=> new TableCell({
            borders: cellBorders,
            shading: ri===0 ? {fill:'F3EEFF'} : undefined,
            margins:{top:80, bottom:80, left:120, right:120},
            children:[new Paragraph({children:[run(String(c), ri===0?{bold:true, color:'6D3FDB'}:{})]})]
          }))
        }));
        children.push(new Table({width:{size:100, type:WidthType.PERCENTAGE}, rows}));
        children.push(spacer(200));
      } else if(s.format==='bullets' && s.items){
        s.items.forEach(it=>{
          children.push(new Paragraph({children:[run(it)], bullet:{level:0}, spacing:{after:90, line:240}}));
        });
        children.push(spacer(120));
      } else {
        children.push(new Paragraph({children:[run(s.body||'')], spacing:{after:220, line:240}}));
      }
    });

    children.push(new Paragraph({text:'智庫觀點', heading:HeadingLevel.HEADING2}));

      })]})],

    }));

    }

    (data.references||[]).forEach(r=>{

        : run(r.title, {color:'6B7280', size:19});

    const doc = new Document({
      styles:{
        default:{ document:{ run:{font:FONT, size:21} } },
        paragraphStyles:[
          {id:'Heading1', name:'Heading 1', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{font:FONT, bold:true, size:32, color:'111827'},
            paragraph:{spacing:{after:160}}},
          {id:'Heading2', name:'Heading 2', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{font:FONT, bold:true, size:24, color:'6D3FDB'},
            paragraph:{spacing:{before:220, after:110}}}
        ]
      },
      sections:[{ children }]
    });
    const blob = await Packer.toBlob(doc);
    const safeName = (data.title||'健康文章').replace(/[\\/:*?"<>|]/g,'');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${safeName}.docx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    alert('Word 檔產生失敗：'+e.message);
  }finally{
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

/* 允許內文用 **重點** 標成「粗體 + 綠底線」 */
function icEmphasis(s){ return esc(s||'').replace(/\*\*(.+?)\*\*/g,'<span class="ic-em">$1</span>'); }

function icSectionBody(s){
  const fmt = s.format;
  if(fmt==='table' && s.table){
    const h = s.table.headers||[];
    const rows = (s.table.rows||[]).slice(0,6);
    return `<div class="ic-table">${
      h.length ? `<div class="ic-th"><div class="c1">${esc(h[0]||'')}</div><div class="c2">${esc(h[1]||'')}</div></div>` : ''
    }${rows.map(r=>`<div class="ic-tr"><div class="c1">${esc(r[0])}</div><div class="c2">${icEmphasis(r[1])}</div></div>`).join('')}</div>`;
  }
  if(fmt==='stats'){
    const st = (s.stats||[]).slice(0,3);
    return `<div class="ic-stats">${st.map(x=>
      `<div class="ic-stat"><span class="sv">${esc(x.value)}</span><span class="sl">${esc(x.label)}</span></div>`).join('')
    }${s.note ? `<div class="ic-stats-note">${icEmphasis(s.note)}</div>` : ''}</div>`;
  }
  if(fmt==='list'){
    const items = (s.items||[]).slice(0,5);
    return `<div class="ic-nlist">${items.map((it,i)=>{
      const t = typeof it === 'string' ? it : (it.text || it.label || '');
      return `<div class="ic-nli"><span class="n">${i+1}</span><span class="t">${icEmphasis(t)}</span></div>`;
    }).join('')}</div>`;
  }
  if(fmt==='steps'){
    return `<div class="ic-steps">${(s.items||[]).slice(0,4).map((it,i)=>
      `<div class="ic-step"><div class="num">${i+1}</div><div class="cap">${esc(typeof it==='string'?it:it.label)}</div></div>`).join('')}</div>`;
  }
  if(fmt==='flow'){
    const f = (s.flow||[]).slice(0,4);
    return `<div class="ic-flow">${f.map((x,i)=>
      `<div class="ic-flow-chip"><span class="fv">${esc(x.value)}</span><span class="fl">${esc(x.label)}</span></div>`+
      (i<f.length-1?'<span class="ic-flow-arrow">→</span>':'')).join('')}</div>`;
  }
  // fallback：label 列
  return `<div class="ic-rows">${(s.items||[]).slice(0,4).map(it=>
    `<div class="ic-row"><div class="k">${esc(it.label)}</div><div class="v">${icEmphasis(it.desc||it.stat||'')}</div></div>`).join('')}</div>`;
}

function buildInfocardCanvasHTML(data){
  // 統一 sections 模型；舊 cards 結構自動轉換
  let secs = data.sections;
  if(!secs) secs = (data.cards||[]).map(c=>({heading:c.heading, format:c.format, items:c.items, table:c.table, flow:c.flow}));
  secs = (secs||[]).slice(0,3);

  const today = new Date();
  const dateStr = `${today.getFullYear()} / ${String(today.getMonth()+1).padStart(2,'0')} / ${String(today.getDate()).padStart(2,'0')}`;
  const head = s => `<div class="ic-section-head"><span class="lbl">${esc(s.heading)}</span><span class="rule"></span><span class="dot"></span></div>`;
  const sec = s => `${head(s)}${icSectionBody(s)}`;

  let sectionsHTML;
  if(secs.length <= 1){
    sectionsHTML = secs.map(sec).join('');
  } else {
    // 區段1 整寬；區段2 + 區段3 並排（左寬右窄）
    sectionsHTML = sec(secs[0]) + `<div class="ic-2col"><div class="ic-col l">${sec(secs[1])}</div>${
      secs[2] ? `<div class="ic-col r">${sec(secs[2])}</div>` : ''
    }</div>`;
  }

  const hook = data.headline_hook ? `<div class="infocard-canvas-hook">${esc(data.headline_hook)}</div>` : '';
  const intro = data.intro ? `<div class="infocard-canvas-intro">${icEmphasis(data.intro)}</div>` : '';
  const hashtags = (data.hashtags||[]).slice(0,6).map(h=>'#'+esc(h)).join('　');
  const srcs = (data.sources || (data.references||[]).map(r=>r.source)).filter(Boolean);
  const srcLine = srcs.length ? `資料來源：${[...new Set(srcs)].map(esc).join('、')}` : '';
  const ftTags = (hashtags || srcLine)
    ? `<div class="ic-ft-tags">${hashtags?`<div class="ic-ft-hash">${hashtags}</div>`:''}${srcLine?`<div class="ic-ft-src">${srcLine}</div>`:''}</div>`
    : '<div></div>';

  return `
    <div class="ic-bg-ellipse"></div>
    <div class="infocard-topbar">
      <span class="ic-tb-deco d1"></span><span class="ic-tb-deco d2"></span>
      <div class="ic-tb-main">
        <div class="logo-badge">${IC_TREE_MARK}</div>
        <div class="brand-name">健康圖文專欄</div>
        <span class="ic-tb-tag">健康新知</span>
      </div>
    </div>
    <div class="infocard-canvas-body">
      ${hook}
      <h1 class="infocard-canvas-main">${esc(data.headline_main)}</h1>
      <div class="ic-meta">最後更新日期　${dateStr}</div>
      ${intro}
      ${sectionsHTML}
    </div>
    <div class="infocard-canvas-footer">
      ${ftTags}
      <div class="ic-ft-brand">${IC_BRAND_MARK}健康智慧中樞</div>
    </div>
  `;
}

async function runTranslate(type){
  if(!API_KEY && !DEMO_MODE){ showModal(); return; }
  const topic = document.getElementById('translate-input').value.trim() || collectedTopic;
  if(!topic){ alert('請先輸入健康主題'); return; }
  collectedTopic = topic;
  const result = document.getElementById('translate-result');
  result.innerHTML = `<div class="detail-card"><div class="dc-body loading"><span class="spinner-sm"></span>轉譯中…</div></div>`;

  if(DEMO_MODE){
    await demoDelay();
    const today = new Date();
    const dateStr = `${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`;
    const verified = (type==='健康文章' && DEMO_ARTICLE_OVERRIDES[topic]) || (type==='健康圖卡' && DEMO_INFOCARD_OVERRIDES[topic]);
    const tpl = verified || DEMO_TRANSLATE[type] || DEMO_TRANSLATE['健康文章'];
    const data = fillTpl(tpl, topic, dateStr);
    if(data.content_type==='健康圖卡' && !data.illustration_category){
      data.illustration_category = DEMO_INFOCARD_ILLUSTRATIONS[topic] || guessIllustrationCategory(topic);
    }
    translatedContent = toPlainText(data);
    lastArticleData = data.content_type==='健康文章' ? data : null;
    lastInfocardData = data.content_type==='健康圖卡' ? data : null;
    result.innerHTML = data.content_type==='健康圖卡'
      ? renderInfocardResult(data, verified ? '判定標準與統計數據引自衛生福利部國民健康署等官方公告並標明年份，未使用療效保證用語。' : '未使用療效保證用語，資料來源為示範性質，正式產出時將以查證後的真實來源取代。（示範）')
      : renderArticleResult(data, verified ? '未使用療效保證用語，數據與來源已查證自衛生福利部國民健康署等官方公告。' : '未使用療效保證用語，資料來源為示範性質，正式產出時將以查證後的真實來源取代。（示範）');
    return;
  }

  try{
    const data = parseAI(await ai(getSysPrompt('translate'), `議題：${topic}\n類型：${type}`));
    translatedContent = toPlainText(data);
    lastArticleData = data.content_type==='健康文章' ? data : null;
    lastInfocardData = data.content_type==='健康圖卡' ? data : null;
    result.innerHTML = data.content_type==='健康圖卡'
      ? renderInfocardResult(data, data.compliance_note)
      : renderArticleResult(data, data.compliance_note);
  }catch(e){ result.innerHTML = `<div class="empty-hint">⚠ 錯誤：${esc(e.message)}</div>`; }
}

function renderReviewResult(data, isDemo){
  reviewChoice = null;
  const result = document.getElementById('review-result');
  const ov = OVERALL_META[data.overall] || OVERALL_META.minor_revision;
  const SEV_LABEL = {high:'高',medium:'中',low:'低'};
  const SEV_CLASS = {high:'risk-high',medium:'risk-mid',low:'risk-low'};

  const dims = (data.dimensions||[]).map(d=>`
    <div class="detail-card">
      <div class="dc-title"><i class="ti ti-list-check"></i>${esc(d.name||'')}<span class="risk-badge ${LEVEL_CLASS[d.level]||'risk-low'}">${esc(d.level||'')}</span></div>
      <div class="dc-body">${esc(d.reason||'')}</div>
      ${d.evidence && d.evidence !== '無' ? `<div class="dc-evidence"><b>證據：</b>${esc(d.evidence)}</div>` : ''}
    </div>`).join('');

  const suggs = (data.suggestions||[]).length
    ? (data.suggestions||[]).map(s=>`
      <div class="sugg-item">
        <div class="sugg-issue">${esc(s.issue||'')}<span class="risk-badge ${SEV_CLASS[s.severity]||'risk-low'}">${SEV_LABEL[s.severity]||''}</span></div>
        <div class="sugg-fix">修正方向：${esc(s.fix||'')}</div>
        ${s.example ? `<div class="sugg-example">✎ 改寫參考：${esc(s.example)}</div>` : ''}
      </div>`).join('')
    : `<div class="dc-body" style="color:var(--text3)">無修正建議</div>`;

  result.innerHTML = `
    <div class="overall-banner ${ov.cls}"><i class="ti ${ov.icon}"></i>${ov.label}｜${esc(data.overall_reason||'')}</div>
    <div class="detail-grid" style="margin-bottom:14px">${dims}</div>
    <div class="detail-card full">
      <div class="dc-title"><i class="ti ti-tool"></i>修正建議</div>
      ${suggs}
    </div>
    <div class="human-review">
      <div class="hr-title"><i class="ti ti-user-check"></i>人工複審（AI 預審＋人複審）</div>
      <div class="hr-choice-row">
        <button class="hr-choice sel-approve" onclick="selectReviewChoice('approve',this)">✓ 核准通過</button>
        <button class="hr-choice sel-revise" onclick="selectReviewChoice('revise',this)">✎ 需修正後再送審</button>
      </div>
      <textarea id="hr-note" class="hr-note" placeholder="複審備註（選填）"></textarea>
      <button class="action-btn primary" onclick="submitHumanReview()"><i class="ti ti-send"></i>送出複審結果</button>
    </div>
  `;
}

function selectReviewChoice(choice, btn){
  reviewChoice = choice;
  document.querySelectorAll('.hr-choice').forEach(el=>el.classList.remove('selected'));
  btn.classList.add('selected');
}

function submitHumanReview(){
  if(!reviewChoice){ alert('請先選擇複審結果'); return; }
  const note = document.getElementById('hr-note').value.trim();
  auditTrail.unshift({
    time: new Date().toLocaleString('zh-TW',{hour12:false}),
    choice: reviewChoice==='approve' ? '核准通過' : '需修正後再送審',
    note,
    version: PROMPT_VERSION
  });
  renderAuditTrail();
  reviewChoice = null;
  document.getElementById('hr-note').value='';
  document.querySelectorAll('.hr-choice').forEach(el=>el.classList.remove('selected'));
}

function renderAuditTrail(){
  const el = document.getElementById('audit-trail-list');
  if(auditTrail.length===0){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="audit-trail-title">Audit Trail 審查紀錄</div>` +
    auditTrail.map(a=>`<div class="audit-item"><span class="at-time">${esc(a.time)}</span><span>${esc(a.choice)}${a.note? '　備註：'+esc(a.note):''}<span style="color:var(--text3)">　治理規則 ${esc(a.version||PROMPT_VERSION)}</span></span></div>`).join('');
}

function chips(options, cb){
  const wrap=document.createElement('div');
  wrap.className='chips-row';
  options.forEach(opt=>{

    wrap.appendChild(btn);

  chat.appendChild(wrap); scrollBottom();
}

const ROUTER_PROMPT = `你是健康智慧中樞平台的 AI 助理，身兼導覽員與衛教顧問。判斷使用者訊息的意圖，只輸出一個 JSON 物件，不加任何說明或 markdown 圍欄：

## 風險偵測（優先於意圖判斷，最高優先權）
risk_flag 先判斷，判斷為 emergency 或 self_harm 時，reply／followups／bridge 一律填 null／空陣列／null（實際安全訊息由系統固定顯示，不由你生成，避免電話號碼被誤植）：
- "emergency"＝訊息內容顯示可能急症或立即危險，包含但不限於：胸痛胸悶、呼吸困難、嘴唇發紫、意識不清、昏倒、抽搐、單側無力、臉歪、口齒不清、嚴重過敏合併呼吸困難、劇烈頭痛、頸部僵硬、高燒不退、嚴重外傷、大量出血、孕婦出血或劇烈腹痛、胎動明顯減少、嬰幼兒持續高燒或活動力明顯下降或脫水、中毒或藥物過量、嚴重腹痛、持續嘔吐、黑便、吐血、嚴重血糖異常、免疫低下者發燒
- "self_harm"＝訊息內容顯示自殺、自傷或傷害他人風險（優先於 emergency 判斷，若同時符合以 self_harm 為準）
- "none"＝以上皆非，正常判斷意圖

## 意圖判斷規則（risk_flag 為 none 時才判斷）
- collect＝想分析、了解某健康議題的趨勢或機會
- translate＝想把健康知識轉成文案、話術、簡報等內容
- review＝想檢查、審核、把關一段內容（訊息中若附有待審文案，完整放入content）
- chat＝一般問候、日常健康知識問答或其他

## chat 意圖的回答規格
reply 撰寫規則：
- 繁體中文，台灣用語，詳盡衛教式回答，400-600字
- 結構：先直接回應核心問題（給明確立場，不含糊）→ 用「1. 2. 3.」分點展開說明 → 實用行動建議 → 視情況附就醫提醒
- 純文字，用換行分段，不使用 markdown 符號（#、*、- 等）
- 重點標示：將關鍵結論與核心行動建議用 ==文字== 包住（每則回答 2-4 處，單處不超過30字），例如「==先從固定起床時間開始執行兩週==」；行動建議段落至少標示一處；此規則適用於對話中的每一則回覆——包含使用者追問後的第二、三次回答，無論回答長短都必須有重點標示；除此語法外不使用任何其他符號標記
- 條列式建議（1. 2. 3. 格式）時，標示要落在每一條的「動作短語」本身（該條建議在做什麼，通常是條目開頭幾個字），不要標在後面的舉例、細節或補充說明上；若條列超過一條，每一條都要各自標示一次動作短語，不可只標其中一兩條、其餘不標
- 護欄：只做群體層級衛教知識，不做個人診斷——「爬樓梯傷膝蓋嗎」可以答，「我膝蓋痛三天是不是關節炎」須引導就醫不可診斷；症狀持續、加劇或涉及用藥的問題一律附「建議諮詢醫師」；禁用詞：保證、治癒、根治、絕對、一定、最高、最優、第一、唯一；資訊以現行台灣衛教共識為準，不引用單一研究當定論；不推薦特定藥品或保健食品品牌
- 問候或非健康話題時，reply 友善簡短即可（80字內），並自然介紹可以問健康問題或使用三大功能

followups 規則（chat 且為健康問答時必填）：
- 固定 2-3 條，該主題的自然延伸問題，以使用者視角的問句撰寫（例：「那已經膝蓋痛的人怎麼辦？」）
- 純問候時可為空陣列

bridge 規則（chat 時填寫）：
- 若話題與某個健康議題的趨勢、風險、保障相關，自然銜接：{"label":"想了解更多○○健康趨勢","topic":"對應的健康議題名稱"}
- 話題無明顯關聯時填 null，不強行推銷
- 非 chat 意圖時，followups 填空陣列、bridge 填 null`;

    if(bridge && opt===bridge.label){
      if(bridge.topic){
        botMsg(`好的，帶您前往<b>收集</b>工作檯分析「${esc(bridge.topic)}」…`);
        setTimeout(()=>{ switchView('collect'); document.getElementById('collect-input').value=bridge.topic; runCollect(bridge.topic); }, 500);
      }else{
        setTimeout(()=>{ switchView('collect'); }, 400);
      }
    }else{
      route(opt);
    }
  });
}

async function route(text){
  showTyping();
  try{
    const d = parseAI(await ai(ROUTER_PROMPT, historyContext() + text));
    hideTyping();
    if(d.risk_flag==='self_harm'){
      botMsg(SELF_HARM_MSG);
      return;
    }
    if(d.risk_flag==='emergency'){
      botMsg(EMERGENCY_MSG);
      return;
    }
    if(d.intent==='collect'){
      if(d.topic){
        botMsg(`收到，帶你前往<b>收集</b>工作檯分析「${esc(d.topic)}」…`);
        setTimeout(()=>{ switchView('collect'); document.getElementById('collect-input').value=d.topic; runCollect(d.topic); }, 500);
      }else{
        botMsg('好的，帶你前往<b>收集</b>工作檯，輸入想分析的健康議題即可開始。');
        setTimeout(()=>{ switchView('collect'); document.getElementById('collect-input').focus(); }, 500);
      }
    }
    else if(d.intent==='translate'){
      botMsg(`好的，帶你前往<b>轉譯</b>工作檯${d.topic?`，已填入「${esc(d.topic)}」`:''}，選擇應用場景即可產出。`);
      setTimeout(()=>{ switchView('translate'); const el=document.getElementById('translate-input'); if(d.topic) el.value=d.topic; el.focus(); }, 500);
    }
    else if(d.intent==='review'){
      if(d.content){
        botMsg('收到，帶你前往<b>審閱</b>工作檯，AI 預審已開始…');
        setTimeout(()=>{ switchView('review'); document.getElementById('review-input').value=d.content; runReview(); }, 500);
      }else{
        botMsg('好的，帶你前往<b>審閱</b>工作檯，貼上內容即可執行 AI 預審。');
        setTimeout(()=>{ switchView('review'); document.getElementById('review-input').focus(); }, 500);
      }
    }
    else{
      const reply = d.reply || '我可以協助你分析健康議題、轉譯內容或審閱文案，也歡迎問我日常健康問題。';
      botMsg(esc(reply).replace(/==([^=\n]+)==/g,'<mark class="hl">$1</mark>').replace(/\n/g,'<br/>'));
      pushHistory('u', text);
      pushHistory('a', reply.replace(/==/g,''));
      chatFollowupChips(d.followups, d.bridge);
    }
  }catch(e){ hideTyping(); botMsg('⚠ 連線問題：'+esc(e.message)); }
}

  chips(['分析健康議題趨勢','轉譯健康內容給特定受眾','審閱待發布的健康文案'], opt=>{

    if(opt.includes('分析')){ botMsg('好的，帶你前往<b>收集</b>工作檯。'); setTimeout(()=>{ switchView('collect'); document.getElementById('collect-input').focus(); }, 400); }
    else if(opt.includes('轉譯')){ botMsg('好的，帶你前往<b>轉譯</b>工作檯。'); setTimeout(()=>{ switchView('translate'); document.getElementById('translate-input').focus(); }, 400); }
    else { botMsg('好的，帶你前往<b>審閱</b>工作檯。'); setTimeout(()=>{ switchView('review'); document.getElementById('review-input').focus(); }, 400); }
  });
})();
